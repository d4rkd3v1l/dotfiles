# Unordered list style
MD004:
  style: "dash"

# Line length
MD013: false

# Multiple headings with the same content
MD024:
  siblings_only: true

# Blank line inside blockquote
MD028: false

# Horizontal rule style
MD035:
  style: "---"

# First line in a file should be a top-level heading
MD041:
  allow_preamble: true

# Files should end with a single newline character
MD047: true

# Code fence style
MD048:
  style: "backtick"

# Emphasis style
MD049:
  style: "asterisk"

# Strong style
MD050:
  style: "asterisk"
