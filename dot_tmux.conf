# --- [ GENERAL ] ------------------------------------------------------------------------

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Set tmux mode to vi (default is emacs)
setw -g mode-keys vi

# Mouse support (e.g. scrolling)
setw -g mouse on

# Selection style
set -wg mode-style bg=green,fg=black


# --- [ WINDOWS ] ------------------------------------------------------------------------

# Start windows and panes at 1 instead 0
set -g base-index 1
setw -g pane-base-index 1

# Don't automatically rename windows
set -g allow-rename off

# Don't prefill old title on rename
bind , command-prompt "rename-window '%%'"

# Renumber windows when a window is closed
set -g renumber-windows on


# --- [ PANES ] ------------------------------------------------------------------------

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Enable pane border status
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#f8f8f2]#[bg=#6272a4],#[fg=#6272a4]#[bg=#363847]} #{pane_index} #{pane_title} #[fg=default]#[bg=default] "

# Dim inactive panes
set -g window-style "fg=#f8f8f2,bg=#363847"
set -g window-active-style "fg=#f8f8f2,bg=#282a36"

# Make border thicker
set -g pane-border-lines heavy

# Rename pane (equivalent to rename-window)
bind . command-prompt -p "(rename-pane)" 'select-pane -T "%%"'

# Navigate panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swap panes
bind > swap-pane -D
bind < swap-pane -U


# --- [ BUFFERS ] ------------------------------------------------------------------------

bind b choose-buffer


# --- [ LOGGING ] ------------------------------------------------------------------------

#set-hook -g session-created 'run ~/.tmux/logging/start_logging.sh'
#set-hook -g after-new-window 'run ~/.tmux/logging/start_logging.sh'
#set-hook -g after-split-window 'run ~/.tmux/logging/start_logging.sh'


# --- [ PLUGINS ] ------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'dracula/tmux'

# Continuum
set -g @continuum-restore 'on'

# Dracula
# Configuration
# To enable plugins set up the @dracula-plugins option in you .tmux.conf file, separate plugin by space. The order that you define the plugins will be the order on the status bar left to right.
# available plugins: battery, cpu-usage, git, gpu-usage, ram-usage, tmux-ram-usage, network, network-bandwidth, network-ping, ssh-session, attached-clients, network-vpn, weather, time, mpc, spotify-tui, playerctl, kubernetes-context, synchronize-panes
set -g @dracula-plugins "battery cpu-usage ram-usage time"

# For each plugin is possible to customize background and foreground colors
# available colors: white, gray, dark_gray, light_purple, dark_purple, cyan, green, orange, red, pink, yellow
# set -g @dracula-[plugin-name]-colors "[background] [foreground]"
set -g @dracula-battery-colors "cyan dark_gray"
set -g @dracula-cpu-usage-colors "orange dark_gray"
set -g @dracula-ram-usage-colors "pink dark_gray"
set -g @dracula-time-colors "green dark_gray"

# Status bar options
# Enable powerline symbols
set -g @dracula-show-powerline false

# Switch powerline symbols
# for left
set -g @dracula-show-left-sep 

# for right symbol (can set any symbol you like as seperator)
set -g @dracula-show-right-sep 

# Enable window flags
set -g @dracula-show-flags false

# Adjust the refresh rate for the status bar
# the default is 5, it can accept any number
set -g @dracula-refresh-rate 1

# Switch the left smiley icon
# it can accept `hostname` (full hostname), `session`, `shortname` (short name), `smiley`, `window`, or any character.
set -g @dracula-show-left-icon session

# Add padding to the left smiley icon
# default is 1, it can accept any number and 0 disables padding.
set -g @dracula-left-icon-padding 1

# Enable high contrast pane border
set -g @dracula-border-contrast false

# cpu-usage options
# Customize label
set -g @dracula-cpu-usage-label " "

# Show system load average instead of CPU usage percentage (default)
# CPU usage percentage (default) - in percentage (output: %) Load average – is the average system load calculated over a given period of time of 1, 5 and 15 minutes (output: x.x x.x x.x)
set -g @dracula-cpu-display-load false

# battery options
# Customize label
set -g @dracula-battery-label " "
set -g @dracula-show-battery-status true

# gpu-usage options
# Customize label
set -g @dracula-gpu-usage-label "GPU"

# ram-usage options
# Customize label
set -g @dracula-ram-usage-label " "

# network-ping options
# You can configure which server (hostname, IP) you want to ping and at which rate (in seconds). Default is google.com at every 5 seconds.
set -g @dracula-ping-server "google.com"
set -g @dracula-ping-rate 5

# time options
# Disable timezone
# set -g @dracula-show-timezone false

# # Swap date to day/month
# set -g @dracula-day-month true

# # Enable military time
# set -g @dracula-military-time true

# Set custom time format
set -g @dracula-time-format "%F %T"

# git options
# Hide details of git changes
set -g @dracula-git-disable-status true

# Set symbol to use for when branch is up to date with HEAD
# default is ✓. Avoid using non unicode characters that bash uses like $, * and ! 
set -g @dracula-git-show-current-symbol ✓

# Set symbol to use for when branch diverges from HEAD
# default is unicode !. Avoid bash special characters 
set -g @dracula-git-show-diff-symbol !

# Set symbol or message to use when the current pane has no git repo
# default is unicode no message
set -g @dracula-git-no-repo-message ""

# Hide untracked files from being displayed as local changes
# default is false
set -g @dracula-git-no-untracked-files true

# weather options
# Switch from default fahrenheit to celsius
set -g @dracula-show-fahrenheit false

# Set your location manually
set -g @dracula-fixed-location ""

# Hide your location
set -g @dracula-show-location false

set -g status-justify centre

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
